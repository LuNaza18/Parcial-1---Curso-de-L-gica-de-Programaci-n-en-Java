$kind: http-request
url: '{{baseUrl}}/api/productos/:productoId'
method: PUT
pathVariables:
  - key: productoId
    value: '1'
    description: ID del producto que se desea actualizar
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nombre": "Cafe actualizado",
      "categoria": "Almacen",
      "cantidad": 15,
      "stockMinimo": 5,
      "precio": 3500.00
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Responde 200', function () { pm.response.to.have.status(200); });
      pm.test('El nombre fue actualizado', function () { pm.expect(pm.response.json().nombre).to.eql('Cafe actualizado'); });
    language: text/javascript
order: 5000
